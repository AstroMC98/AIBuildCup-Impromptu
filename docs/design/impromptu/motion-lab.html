<title>Impromptu Motion Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap">
<style>
/* Layout: a lab bench. Scene list on the left (chips on phones), one phone stage in the
   middle that plays the selected moment, and a spec panel on the right saying what in the
   app drives it. The phone is a fixed render of the app; the bench follows the theme. */
:root {
  --paper: #F1F3F6;
  --paper-2: #E2E6EC;
  --card: #FFFFFF;
  --ink: #141720;
  --ink-2: #4F5667;
  --line: #D2D7E0;
  --focus: #2F5BFF;
  --tally: #FF3B30;
  --bezel: #07080B;
  --f-ui: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --f-display: "Anybody", "Arial Narrow", "Segoe UI", sans-serif;
  --spring-snappy: linear(0, 0.021 2.5%, 0.076 5%, 0.151 7.5%, 0.238 10%, 0.329 12.5%, 0.419 15%, 0.505 17.5%, 0.585 20%, 0.657 22.5%, 0.721 25%, 0.777 27.5%, 0.824 30%, 0.865 32.5%, 0.898 35%, 0.925 37.5%, 0.947 40%, 0.965 42.5%, 0.978 45%, 0.988 47.5%, 0.996 50%, 1.001 52.5%, 1.005 55%, 1.007 57.5%, 1.009 60%, 1.009 65%, 1.008 70%, 1.006 77.5%, 1.004 85%, 1.002 92.5%, 1);
  --spring-smooth: linear(0, 0.021 2.5%, 0.074 5%, 0.147 7.5%, 0.23 10%, 0.318 12.5%, 0.404 15%, 0.487 17.5%, 0.563 20%, 0.633 22.5%, 0.695 25%, 0.749 27.5%, 0.796 30%, 0.836 32.5%, 0.87 35%, 0.898 37.5%, 0.921 40%, 0.94 42.5%, 0.955 45%, 0.968 47.5%, 0.977 50%, 0.985 52.5%, 0.99 55%, 0.995 57.5%, 0.998 60%, 1 62.5%, 1.002 67.5%, 1.003 75%, 1.002 87.5%, 1);
  --spring-bouncy: linear(0, 0.045 2.5%, 0.161 5%, 0.317 7.5%, 0.49 10%, 0.66 12.5%, 0.814 15%, 0.941 17.5%, 1.04 20%, 1.108 22.5%, 1.148 25%, 1.165 27.5%, 1.163 30%, 1.147 32.5%, 1.123 35%, 1.095 37.5%, 1.066 40%, 1.04 42.5%, 1.017 45%, 0.999 47.5%, 0.986 50%, 0.977 52.5%, 0.973 55%, 0.973 57.5%, 0.974 60%, 0.978 62.5%, 0.982 65%, 0.987 67.5%, 0.992 70%, 0.996 72.5%, 0.999 75%, 1.002 77.5%, 1.004 82.5%, 1.004 90%, 1);
  --spring-gentle: linear(0, 0.023 2.5%, 0.08 5%, 0.155 7.5%, 0.239 10%, 0.324 12.5%, 0.407 15%, 0.485 17.5%, 0.555 20%, 0.619 22.5%, 0.676 25%, 0.725 27.5%, 0.768 30%, 0.805 32.5%, 0.836 35%, 0.863 37.5%, 0.886 40%, 0.905 42.5%, 0.921 45%, 0.935 47.5%, 0.946 50%, 0.956 52.5%, 0.963 55%, 0.97 57.5%, 0.975 60%, 0.98 62.5%, 0.986 67.5%, 0.991 72.5%, 0.995 80%, 0.998 90%, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1016; --paper-2: #1A1D26; --card: #151821; --ink: #ECEEF3; --ink-2: #9AA1B2; --line: #262A35; --focus: #7C9BFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1016; --paper-2: #1A1D26; --card: #151821; --ink: #ECEEF3; --ink-2: #9AA1B2; --line: #262A35; --focus: #7C9BFF;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-ui); }
h1, h2, h3, p, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 56px; }

/* ---- wordmark: the tittle of the i is the tally lamp ------------------------------ */
.wm { font-family: var(--f-display); font-weight: 800; font-stretch: 112%; font-style: italic; letter-spacing: -0.02em; line-height: 1; display: inline-flex; white-space: nowrap; padding-top: .25em; }
.wm .iw { position: relative; display: inline-block; }
.wm .i { display: inline-block; clip-path: inset(0.02em -0.2em -0.3em -0.2em); }
.wm .tittle { position: absolute; left: 0.24em; top: -0.25em; width: .22em; height: .22em; border-radius: 50%; background: var(--tally); box-shadow: 0 0 .35em .05em color-mix(in oklch, var(--tally) 55%, transparent); }
.wm .tittle.off { background: #5A2622; box-shadow: none; }

/* ---- bench chrome -------------------------------------------------------------- */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: end; }
@media (max-width: 820px) { .top { grid-template-columns: minmax(0, 1fr); } }
.top .wm { font-size: 26px; }
.top h1 { margin-top: 14px; font-family: var(--f-display); font-weight: 780; font-stretch: 88%; font-size: clamp(32px, 5vw, 52px); line-height: 1; letter-spacing: -0.02em; }
.top p { margin-top: 10px; color: var(--ink-2); max-width: 60ch; }
.ctls { display: flex; flex-wrap: wrap; gap: 8px; }
.ctl { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 650; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.ctl[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ctl svg { width: 16px; height: 16px; }
.speed { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--card); padding: 3px; gap: 2px; }
.speed button { height: 32px; min-width: 48px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.lab { margin-top: 28px; display: grid; grid-template-columns: 230px auto minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 1100px) { .lab { grid-template-columns: minmax(0, 1fr); } }
.scenes { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 16px; }
.grp h2 { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.grp ul { display: flex; flex-direction: column; gap: 2px; }
.scene-btn { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer; font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.scene-btn:hover { background: var(--paper-2); }
.scene-btn[aria-current="true"] { background: var(--ink); color: var(--paper); }
.scene-btn .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.scene-btn[aria-current="true"] .lamp { background: var(--tally); box-shadow: 0 0 8px var(--tally); }
@media (max-width: 1100px) {
  .scenes { position: static; flex-direction: row; overflow-x: auto; gap: 14px; padding-bottom: 6px; scrollbar-width: thin; }
  .grp { flex: none; }
  .grp ul { flex-direction: row; }
  .scene-btn { white-space: nowrap; }
}

.bench { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.phone { width: 340px; max-width: 100%; height: 700px; border-radius: 48px; padding: 9px; background: var(--bezel); box-shadow: 0 34px 70px -24px rgba(8, 10, 20, .5), inset 0 0 0 1.5px #2A2C33; }
@media (max-width: 400px) { .phone { height: 660px; } }
.screen { position: relative; width: 100%; height: 100%; border-radius: 39px; overflow: hidden; isolation: isolate; background: #0B0C12; contain: layout paint; }
.island { position: absolute; z-index: 90; left: 50%; top: 10px; width: 96px; height: 27px; margin-left: -48px; border-radius: 20px; background: #000; pointer-events: none; }
.bench-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; font-size: 14px; color: var(--ink-2); }
.bench-row label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.bench-row input { width: 18px; height: 18px; accent-color: var(--ink); }
.hint { font-size: 13px; color: var(--ink-2); text-align: center; max-width: 34ch; min-height: 1.5em; }

.spec { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.spec h2 { font-family: var(--f-display); font-weight: 780; font-stretch: 90%; font-size: 30px; line-height: 1.05; letter-spacing: -0.015em; }
.spec .lede { color: var(--ink-2); }
.spec dl { margin: 0; display: grid; gap: 14px; }
.spec dt { font-weight: 800; font-size: 14px; }
.spec dd { margin: 3px 0 0; color: var(--ink-2); font-size: 15px; max-width: 62ch; }
.spec code { font-size: 13px; background: var(--paper-2); border-radius: 5px; padding: 1px 5px; color: var(--ink); overflow-wrap: anywhere; }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; }
.tok { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); }

/* =========================================================================
   APP: the Live Wire stage (fixed render, always dark)
   ========================================================================= */
@property --gel { syntax: "<color>"; inherits: true; initial-value: #FF6B9A; }
@property --level { syntax: "<number>"; inherits: true; initial-value: 0; }
.stage {
  position: absolute; inset: 0;
  --gel: #FF6B9A;
  --stage: color-mix(in oklch, var(--gel) 19%, #08090E);
  --stage-hi: color-mix(in oklch, var(--gel) 46%, #0A0B11);
  --glow: color-mix(in oklch, var(--gel) 72%, transparent);
  --gel-text: color-mix(in oklch, var(--gel) 32%, #FFFFFF);
  --on-dim: color-mix(in oklch, var(--gel) 18%, #B9BCC8);
  transition: --gel 1.2s ease;
  background:
    radial-gradient(90% 55% at 12% -4%, color-mix(in oklch, var(--stage-hi) calc(62% + var(--level) * 38%), transparent), transparent 70%),
    radial-gradient(120% 70% at 100% 110%, color-mix(in oklch, var(--gel) 14%, transparent), transparent 60%),
    var(--stage);
  color: #fff; font-family: var(--f-ui); display: flex; flex-direction: column;
}
.s-top { display: flex; align-items: center; gap: 10px; padding: 50px 18px 0; min-height: 76px; }
.s-tally { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px 0 8px; border-radius: 6px; background: var(--tally); color: #fff;
  font: 800 12px/1 var(--f-display); font-stretch: 118%; letter-spacing: .06em; box-shadow: 0 0 18px -2px color-mix(in oklch, var(--tally) 70%, transparent); flex: none; }
.s-tally i { width: 7px; height: 7px; border-radius: 50%; background: #fff; }
.s-tally.off { background: #2B1412; color: #7A3E37; box-shadow: none; }
.s-tally.off i { background: #7A3E37; }
.s-clock { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.s-clock svg { width: 26px; height: 26px; }
.ring circle { fill: rgba(255, 255, 255, .16); transition: fill .25s; }
.ring circle.q { fill: rgba(255, 255, 255, .4); }
.ring circle.lit { fill: var(--gel-text, #FFB257); }
.ring circle.q.lit { fill: #fff; }
.s-listen { margin-left: auto; font-size: 13px; color: var(--on-dim); font-weight: 600; }
.s-back { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .12); color: #fff; display: grid; place-items: center; cursor: pointer; }
.s-ep { display: flex; align-items: center; gap: 12px; padding: 16px 18px 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; width: 100%; }
.s-cover { width: 46px; height: 46px; border-radius: 8px; flex: none; position: relative; overflow: hidden; background: radial-gradient(80% 80% at 20% 10%, var(--gel), color-mix(in oklch, var(--gel) 40%, #000)); }
.s-cover::after { content: "W"; position: absolute; right: 3px; bottom: -6px; font: 900 36px/1 var(--f-display); font-stretch: 60%; color: rgba(0, 0, 0, .32); }
.s-ep b { display: block; font: 760 17px/1.15 var(--f-display); font-stretch: 92%; }
.s-chap { font-size: 13px; color: var(--on-dim); }
.s-caps { flex: 1; min-height: 0; padding: 8px 22px 6px; display: flex; flex-direction: column; justify-content: center; gap: 14px; overflow: hidden; }
.s-prev { font-size: 15px; line-height: 1.3; color: var(--on-dim); font-weight: 600; opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.s-prev:empty { display: none; }
.s-who { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--gel-text); flex-wrap: wrap; }
.s-who i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.s-pill { font: 800 11px/1 var(--f-display); font-stretch: 112%; letter-spacing: .03em; padding: 4px 7px; border-radius: 5px; background: #FFD7E6; color: #2A0F1C; }
.s-now { font-family: var(--f-display); font-weight: 720; font-size: 30px; line-height: 1.07; letter-spacing: -0.012em; }
.s-now .w { opacity: .26; transition: opacity .22s ease, color .3s ease; }
.s-now .w.said { opacity: 1; }
.s-now .w.now { opacity: 1; color: var(--gel-text); background: linear-gradient(var(--glow), var(--glow)) 0 94% / calc(var(--wp, 0) * 100%) .09em no-repeat; }
.s-chapters { display: flex; gap: 4px; padding: 6px 18px 10px; }
.s-chapters i { position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .22); overflow: hidden; }
.s-chapters i.done { background: #fff; }
.s-chapters i b { position: absolute; inset: 0 auto 0 0; background: #fff; border-radius: 2px; }
.s-hosts { display: flex; gap: 8px; padding: 0 18px 10px; }
.s-host { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 4px; border-radius: 999px; background: rgba(255, 255, 255, .08); font-size: 13px; font-weight: 700; color: var(--on-dim); transition: background .3s, color .3s; }
.s-host .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #10121A; font-weight: 800; position: relative; }
.s-host .av::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--gel-text); opacity: 0; transform: scale(calc(1 + var(--lv, 0) * .32)); transition: transform .08s linear, opacity .2s; }
.s-host.talk { background: rgba(255, 255, 255, .16); color: #fff; }
.s-host.talk .av::before { opacity: calc(.35 + var(--lv, 0) * .65); }
.s-bar { display: flex; align-items: center; gap: 8px; padding: 0 14px 24px; }
.s-field { flex: 1; min-width: 0; height: 46px; border-radius: 999px; background: rgba(255, 255, 255, .12); display: flex; align-items: center; padding: 0 16px; color: var(--on-dim); font-size: 14px; white-space: nowrap; overflow: hidden; }
.s-field.typing { color: #fff; }
.s-round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .12); flex: none; border: 0; color: #fff; cursor: pointer; position: relative; }
.s-round.white { background: #fff; color: #10121A; }
.s-round svg { width: 20px; height: 20px; }
.s-count { position: absolute; top: -6px; right: -4px; min-width: 22px; height: 18px; padding: 0 5px; border-radius: 9px; background: #fff; color: #10121A; font: 800 11px/18px var(--f-ui); display: none; overflow: hidden; font-variant-numeric: tabular-nums; }
.with-count .s-count { display: inline-flex; }
.odo { display: inline-block; height: 18px; overflow: hidden; }
.odo span { display: flex; flex-direction: column; }
.odo span i { font-style: normal; height: 18px; line-height: 18px; text-align: center; }

/* call-in lines (borrowed from Switchboard) */
.lines { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--spring-smooth); margin: 0 14px; }
.lines.open { grid-template-rows: 1fr; }
.lines > div { overflow: hidden; }
.line { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; margin-bottom: 8px; border-radius: 12px; background: rgba(255, 255, 255, .08); font-size: 13px; }
.line .lamp { width: 10px; height: 10px; border-radius: 50%; background: #3A3326; }
.line.wait .lamp { background: #FFB000; box-shadow: 0 0 8px #FFB000; animation: blink .8s steps(1) infinite; }
.line.next .lamp { background: #FFB000; box-shadow: 0 0 8px #FFB000; }
.line.air .lamp { background: var(--tally); box-shadow: 0 0 10px var(--tally); }
.line .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.line .st { font-weight: 700; color: var(--on-dim); font-variant-numeric: tabular-nums; }
.line.air .st { color: #fff; }
@keyframes blink { 50% { opacity: .25; } }

/* toast as a cue card */
.cue { position: absolute; z-index: 70; left: 16px; right: 16px; top: 48px; padding: 12px 14px 14px; border-radius: 10px; background: #FFFFFF; color: #141720; font-weight: 700; font-size: 14px;
  box-shadow: 0 14px 34px -10px rgba(0, 0, 0, .55); overflow: hidden;
  background-image: repeating-linear-gradient(transparent 0 21px, rgba(80, 130, 200, .16) 21px 22px); background-position: 0 30px; }
.cue::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--tally); }
.cue small { display: block; font-weight: 600; color: #4F5667; margin-top: 2px; }
.cue .timer { position: absolute; left: 0; bottom: 0; height: 3px; background: #141720; opacity: .18; width: 100%; transform-origin: left; }

/* ---- house (library side, lights up) -------------------------------------------- */
.house { position: absolute; inset: 0; background: #F1F3F6; color: #141720; display: flex; flex-direction: column; font-family: var(--f-ui); }
.h-top { display: flex; align-items: center; gap: 8px; padding: 50px 16px 8px; }
.h-top .wm { font-size: 22px; color: #141720; }
.h-credits { margin-left: auto; height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid #D2D7E0; display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
.h-credits i { width: 10px; height: 10px; border-radius: 50%; background: #E9A93A; }
.h-av { width: 32px; height: 32px; border-radius: 50%; background: #141720; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.h-greet { padding: 10px 16px 4px; font: 780 27px/1.02 var(--f-display); font-stretch: 86%; letter-spacing: -0.015em; text-wrap: balance; }
.h-sec { padding: 14px 16px 8px; font: 760 16px/1 var(--f-display); font-stretch: 96%; display: flex; align-items: center; gap: 8px; }
.h-sec .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tally); box-shadow: 0 0 8px var(--tally); }
.sleeve { --gel: #FF6B9A; position: relative; overflow: hidden; border-radius: 12px; color: #fff; border: 0; padding: 0; cursor: pointer; text-align: left;
  background: radial-gradient(90% 90% at 18% 8%, color-mix(in oklch, var(--gel) 95%, #fff), color-mix(in oklch, var(--gel) 55%, #120A10) 62%, color-mix(in oklch, var(--gel) 25%, #07060A)); }
.sleeve .t { position: absolute; left: 12px; right: 10px; bottom: 30px; font: 860 36px/.86 var(--f-display); font-stretch: 58%; letter-spacing: -0.01em; }
.sleeve .h { position: absolute; left: 12px; bottom: 11px; font-size: 11px; font-weight: 700; opacity: .88; }
.sleeve .live { position: absolute; left: 10px; top: 10px; font: 800 10px/1 var(--f-display); font-stretch: 118%; letter-spacing: .05em; padding: 4px 6px; border-radius: 4px; background: var(--tally); }
.sleeve .rg { position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; opacity: .55; }
.sleeve .rg circle { fill: rgba(255, 255, 255, .35); }
.sleeve .rg circle.lit { fill: #fff; }
.h-live { padding: 0 16px; display: flex; gap: 10px; }
.h-live .sleeve { width: 168px; height: 168px; flex: none; }
.h-live .side { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; font-size: 13px; color: #4F5667; min-width: 0; }
.h-live .side b { color: #141720; font-size: 15px; }
.h-rows { padding: 4px 10px; display: flex; flex-direction: column; }
.h-row { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 10px; }
.h-row .sleeve { width: 48px; height: 48px; border-radius: 7px; flex: none; cursor: default; }
.h-row .sleeve .t { font-size: 16px; left: 5px; bottom: 5px; right: 4px; line-height: .85; }
.h-row b { display: block; font-size: 14px; font-weight: 700; line-height: 1.2; }
.h-row span.m { font-size: 13px; color: #4F5667; }
.h-row .m.live { color: #C81E3A; font-weight: 700; }
.tabs { position: relative; margin: 6px 16px 4px; display: grid; grid-template-columns: repeat(4, 1fr); background: #E2E6EC; border-radius: 12px; padding: 4px; }
.tabs button { position: relative; z-index: 1; height: 34px; border: 0; background: transparent; font-weight: 700; font-size: 13px; color: #4F5667; cursor: pointer; border-radius: 9px; }
.tabs button[aria-selected="true"] { color: #141720; }
.tabs .ind { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; border-radius: 9px; background: #fff; box-shadow: 0 1px 3px rgba(20, 23, 32, .12); }
.chips { display: flex; gap: 6px; padding: 8px 16px; }

/* ---- round 2 scenes ---------------------------------------------------------------- */

.memo-opts { position: absolute; z-index: 30; inset: 0; top: 0; transform: translateY(100%); }
.memo-chip { margin: 6px 16px 0; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px #D6DBE3; }
.memo-chip .pb { width: 38px; height: 38px; border-radius: 50%; background: #141720; color: #fff; display: grid; place-items: center; flex: none; }
.memo-chip .wv { flex: 1; display: flex; align-items: center; gap: 2px; height: 30px; }
.memo-chip .wv i { flex: 1; border-radius: 2px; background: #141720; }
.spine { display: flex; flex-direction: column; margin: 0 18px; }
.spine li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 12px; padding-bottom: 11px; position: relative; font-size: 13.5px; font-weight: 650; color: #5E6577; transition: color .3s; }
.spine li .rail { position: absolute; left: 5px; top: 15px; bottom: 0; width: 2px; background: #1E2230; overflow: hidden; }
.spine li .rail b { position: absolute; inset: 0; background: #9CC2FF; transform: scaleY(0); transform-origin: top; }
.spine li:last-child .rail { display: none; }
.spine li.done { color: #A6ACBC; }
.spine li.now { color: #fff; }
.spine li .lampx { margin-top: 3px; }
.spine li small { display: block; font-weight: 600; font-size: 12px; color: #8C92A3; margin-top: 2px; min-height: 0; }
.spine li.now small { color: #CFE3FF; }

.calm-note { position: absolute; z-index: 95; left: 12px; right: 12px; bottom: 12px; padding: 6px 10px; border-radius: 8px; background: rgba(0, 0, 0, .6); color: #fff; font-size: 12px; font-weight: 700; text-align: center; pointer-events: none; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <span class="wm" aria-label="impromptu"><span aria-hidden="true"><span class="iw"><span class="i">i</span><span class="tittle"></span></span>mpromptu</span></span>
      <h1>Motion Lab</h1>
      <p>Every wait and every change of screen, in the Live Wire direction. Pick a moment and watch it, then slow it down or switch on reduced motion. The panel beside the phone says what in the app drives each one.</p>
    </div>
    <div class="ctls" role="group" aria-label="Playback">
      <button class="ctl" id="replay" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>Replay</button>
      <span class="speed" role="group" aria-label="Speed"><button type="button" data-speed="1" aria-pressed="true">1&times;</button><button type="button" data-speed="0.5" aria-pressed="false">&frac12;&times;</button><button type="button" data-speed="0.25" aria-pressed="false">&frac14;&times;</button></span>
      <button class="ctl" id="loop" type="button" aria-pressed="true">Loop</button>
      <button class="ctl" id="calm" type="button" aria-pressed="false">Reduced motion</button>
    </div>
  </header>

  <div class="lab">
    <nav class="scenes" id="scenes" aria-label="Moments"></nav>
    <section class="bench" aria-label="Preview">
      <div class="phone"><div class="screen" id="screen"></div></div>
      <div class="bench-row" id="bench-row"></div>
      <p class="hint" id="hint"></p>
    </section>
    <aside class="spec" id="spec" aria-live="polite"></aside>
  </div>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const css = getComputedStyle(document.documentElement);
  const SPR = Object.fromEntries(["snappy", "smooth", "bouncy", "gentle"].map((k) => [k, css.getPropertyValue(`--spring-${k}`).trim() || "ease-out"]));
  const DUR = { snappy: 430, smooth: 590, bouncy: 790, gentle: 850 };
  const EASE_OUT = "cubic-bezier(.16, 1, .3, 1)";
  const EASE_IN = "cubic-bezier(.7, 0, .84, 0)";
  const EASE_IO = "cubic-bezier(.65, 0, .35, 1)";

  const mq = matchMedia("(prefers-reduced-motion: reduce)");
  let calm = mq.matches;
  let speed = 1;
  let loop = true;
  let run = 0;
  let current = null;
  let userTook = false;
  const ABORT = Symbol("abort");
  const screen = $("#screen");

  const sleep = (ms) => {
    const id = run;
    return new Promise((res, rej) => setTimeout(() => (id === run ? res() : rej(ABORT)), ms / speed));
  };
  const alive = (id) => { if (id !== run) throw ABORT; };
  const anim = (el, kf, o = {}) => el.animate(kf, { duration: o.dur ?? 300, delay: o.delay ?? 0, easing: o.ease ?? EASE_OUT, fill: o.fill ?? "both", iterations: o.iter ?? 1 });
  const rect = (el) => { const s = screen.getBoundingClientRect(), b = el.getBoundingClientRect(); return { x: b.left - s.left, y: b.top - s.top, w: b.width, h: b.height }; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

  function ringSvg(cls = "ring") { return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"></svg>`; }
  function drawRing(svg, r = 44, dot = 2.2) {
    let out = "";
    for (let i = 0; i < 60; i++) {
      const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const q = i % 15 === 0;
      out += `<circle class="${q ? "q" : ""}" cx="${(50 + r * Math.cos(a)).toFixed(2)}" cy="${(50 + r * Math.sin(a)).toFixed(2)}" r="${q ? dot * 1.35 : dot}"></circle>`;
    }
    svg.innerHTML = out;
    return $$("circle", svg);
  }
  const wmHtml = (lit = true) => `<span class="wm" aria-label="impromptu"><span aria-hidden="true"><span class="iw"><span class="i">i</span><span class="tittle ${lit ? "" : "off"}"></span></span>mpromptu</span></span>`;
  const ICON = {
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    heartFill: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3z"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v3"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2-7z"/></svg>',
    down: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
    play: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg>',
    pause: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M8 5v14M16 5v14"/></svg>',
    b15: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>',
  };

  // ---- the live stage, used by most scenes --------------------------------------
  const TITLE = "Wild Yeast and the Gold Rush";
  function stageHtml({ gel = "#FF6B9A", tally = true, chapter = "Chapter 2, The Gold Rush", back = false, lines = false } = {}) {
    return `<div class="stage" style="--gel:${gel}">
      <header class="s-top"><span class="s-tally ${tally ? "" : "off"}"><i></i>ON AIR</span>
        <span class="s-clock">${ringSvg()}<span class="s-time">1:42</span></span>
        ${back ? `<button class="s-back" type="button" data-back aria-label="Back to the library">${ICON.back}</button>` : `<span class="s-listen">128 listening</span>`}</header>
      <button class="s-ep" type="button" data-ep><span class="s-cover"></span><span><b>${TITLE}</b><span class="s-chap">${chapter}</span></span></button>
      <section class="s-caps"><div class="s-prev"></div><div class="s-nowwrap"></div></section>
      <div class="s-chapters"><i class="done"></i><i class="cur"><b style="width:42%"></b></i><i></i><i></i></div>
      ${lines ? `<div class="lines"><div><div class="line" data-line><span class="lamp"></span><span class="msg"></span><span class="st"></span></div></div></div>` : ""}
      <div class="s-hosts"><span class="s-host" data-h="0"><span class="av" style="background:#FFB257">M</span>Mia</span><span class="s-host" data-h="1"><span class="av" style="background:#9CC2FF">J</span>Jordan</span></div>
      <div class="s-bar"><span class="s-field" data-field>Call in to the hosts</span><button class="s-round" type="button" data-heart aria-label="React">${ICON.heart}<span class="s-count" data-count><span class="odo" data-odo></span></span></button><button class="s-round white" type="button" data-send aria-label="Talk to the hosts">${ICON.mic}</button></div>
    </div>`;
  }
  function primeStage(root) {
    const svg = $(".s-clock svg", root);
    if (svg) drawRing(svg, 42, 3.4).forEach((d, i) => i <= 42 && d.classList.add("lit"));
  }

  // Captions: words light up as they're said; long lines narrow before they shrink.
  const LINES = [
    { who: 0, text: "Okay, but listen. Miners in 1849 carried starter in pouches around their necks to keep it warm." },
    { who: 1, text: "Which is why prospectors got called sourdoughs. The nickname stuck to the people." },
    { who: 0, text: "Science gave a microbe a hometown. I love that for it." },
  ];
  const HOSTS = ["Mia", "Jordan"];
  function timeline(lines, lead = 0.2) {
    let t = lead;
    return lines.map((ln, i) => {
      const words = ln.text.split(/\s+/), starts = [];
      for (const w of words) { starts.push(t); t += 0.16 + 0.048 * w.replace(/[^\w']/g, "").length + (/[.?!]$/.test(w) ? 0.34 : /[,;:]$/.test(w) ? 0.16 : 0); }
      const L = { ...ln, i, words, starts, start: starts[0], end: t };
      t += 0.55;
      return L;
    });
  }
  class Caps {
    constructor(stage, lines = LINES) {
      this.stage = stage; this.prev = $(".s-prev", stage); this.wrap = $(".s-nowwrap", stage);
      this.tl = timeline(lines); this.total = this.tl[this.tl.length - 1].end + 1.2; this.t = 0; this.li = -1; this.spans = []; this.on = true;
      this.hosts = $$(".s-host", stage);
    }
    fit() {
      const inner = $(".s-now", this.wrap); if (!inner) return;
      const max = this.wrap.parentElement.clientHeight - this.prev.offsetHeight - 30;
      inner.style.fontSize = "";
      // A long single word (a Latin bacterium name) can overflow the width, so check both.
      const fits = () => this.wrap.offsetHeight <= max && this.wrap.scrollWidth <= this.wrap.clientWidth;
      for (const s of [100, 90, 80, 70, 62]) { this.wrap.style.fontStretch = s + "%"; if (fits()) return; }
      for (let z = 28; z >= 18; z -= 2) { inner.style.fontSize = z + "px"; if (fits()) return; }
    }
    show(L, pill = "") {
      const old = this.tl[this.li];
      this.prev.textContent = old ? `${HOSTS[old.who]}: ${old.text}` : "";
      this.wrap.innerHTML = `<div class="s-who"><i></i>${HOSTS[L.who]}${pill ? `<span class="s-pill">${pill}</span>` : ""}</div><div class="s-now">${L.words.map((w) => `<span class="w">${esc(w)}</span>`).join(" ")}</div>`;
      this.spans = $$(".w", this.wrap);
      this.fit();
      if (!calm) anim(this.wrap, [{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }], { dur: DUR.smooth, ease: SPR.smooth });
    }
    tick(dt) {
      if (!this.on) return;
      this.t += dt;
      if (this.t > this.total) { this.t = 0; this.li = -1; }
      let li = -1;
      for (let k = 0; k < this.tl.length; k++) if (this.tl[k].start <= this.t) li = k;
      if (li < 0) return;
      const L = this.tl[li];
      if (li !== this.li) { this.show(L, L.pill); this.li = li; }
      let wi = L.words.length, wp = 1, level = 0;
      if (this.t < L.end) {
        wi = 0;
        for (let k = 0; k < L.starts.length; k++) if (L.starts[k] <= this.t) wi = k;
        const e = wi + 1 < L.starts.length ? L.starts[wi + 1] : L.end;
        wp = Math.min(1, (this.t - L.starts[wi]) / (e - L.starts[wi]));
        level = Math.pow(Math.sin(Math.PI * Math.min(wp * 1.18, 1)), 0.6) * (0.5 + 0.5 * hash(li * 31 + wi));
      }
      if (calm) wi = this.spans.length;
      this.spans.forEach((s, k) => { const c = k < wi ? "w said" : k === wi ? "w now" : "w"; if (s.className !== c) s.className = c; });
      $(".s-now", this.wrap)?.style.setProperty("--wp", wp.toFixed(3));
      this.stage.style.setProperty("--level", calm ? "0" : level.toFixed(3));
      this.hosts.forEach((h, k) => { const talk = this.t < L.end && L.who === k; h.classList.toggle("talk", talk); h.style.setProperty("--lv", talk && !calm ? level.toFixed(3) : "0"); });
    }
  }

  // ---- the house (library side) -----------------------------------------------------
  function houseHtml({ rows = true, live = true } = {}) {
    return `<div class="house">
      <header class="h-top">${wmHtml()}<span class="h-credits"><i></i>60</span><span class="h-av">M</span></header>
      <h3 class="h-greet">Hi Marc. What should today's pod be about?</h3>
      ${live ? `<div class="h-sec"><span class="dot"></span>Live now</div>
      <div class="h-live"><button class="sleeve" type="button" data-sleeve aria-label="Open ${TITLE}">${ringSvg("rg ring")}<span class="live">LIVE</span><span class="t">${TITLE}</span><span class="h">Mia and Jordan</span></button>
        <div class="side"><b>128 listening</b>Started 1 min ago<br>Chapter 2 of 4</div></div>` : ""}
      ${rows ? `<div class="h-sec">Your pods</div><div class="h-rows">${PODS.slice(0, 3).map(podRow).join("")}</div>` : ""}
    </div>`;
  }
  const PODS = [
    { t: "Why bridges sing in the wind", g: "#6FB3FF", m: "Science deep-dive, 14:52", s: "finished" },
    { t: "Our first apartment, ranked", g: "#FFB257", m: "Married couple chat, 9:40", s: "finished" },
    { t: "The case for naps", g: "#8BD17C", m: "Live now", s: "live" },
    { t: "Debate: cats or dogs", g: "#B69CFF", m: "Debate night, 15:00", s: "finished" },
    { t: "Notes for Friday's pitch", g: "#F2D16B", m: "Draft, Inspirational talk", s: "draft" },
  ];
  const podRow = (p) => `<div class="h-row" data-s="${p.s}"><span class="sleeve" style="--gel:${p.g}"><span class="t">${p.t.split(" ")[0]}</span></span><span><b>${p.t}</b><span class="m ${p.s === "live" ? "live" : ""}">${p.m}</span></span></div>`;
  function primeHouse(root) {
    $$(".rg", root).forEach((svg) => drawRing(svg, 44, 2).forEach((d, i) => i % 3 === 0 && d.classList.add("lit")));
  }

  // =================================================================================
  // Scenes
  // =================================================================================
  const SCENES = [];
  const scene = (o) => SCENES.push(o);

  // ---- Opening the app ------------------------------------------------------------
  scene({
    id: "boot", group: "Arriving", name: "Opening the app",
    lede: "A short ident while the app checks who you are. The wordmark opens on the width axis, the tally lamp in the i switches on, and the mark flies into the header of your home screen.",
    when: "Cold start only, while <code>session.load()</code> waits for <code>/api/me</code>. If that answers in under 250 ms, the ident is skipped.",
    driven: "<code>main.js boot()</code>. The ident never holds the first screen back: when data is ready it jumps to the hand-off.",
    timing: ["Letters 35 ms apart", "spring smooth 590 ms", "lamp flicker 450 ms", "fly to header: spring gentle 850 ms"],
    reduced: "The lit wordmark appears, then cross-fades to home in 200 ms.",
    mount() {
      screen.innerHTML = houseHtml() + `<div class="boot"><span class="wm" aria-label="impromptu"><span aria-hidden="true" class="ls"></span></span><p class="boot-cap">Getting your pods</p></div>`;
      primeHouse(screen);
      const ls = $(".boot .ls");
      ls.innerHTML = `<span class="iw l"><span class="i">i</span><span class="tittle off"></span></span>` + "mpromptu".split("").map((c) => `<span class="l">${c}</span>`).join("");
    },
    async play() {
      const boot = $(".boot"), wm = $(".boot .wm"), letters = $$(".boot .l"), tittle = $(".boot .tittle"), house = $(".house");
      const target = $(".h-top .wm", house);
      target.style.visibility = "hidden";
      $$(".h-greet, .h-sec, .h-live, .h-rows", house).forEach((e) => (e.style.opacity = 0));
      if (calm) {
        tittle.classList.remove("off");
        await sleep(700);
        anim(boot, [{ opacity: 1 }, { opacity: 0 }], { dur: 200 });
        $$(".h-greet, .h-sec, .h-live, .h-rows", house).forEach((e) => (e.style.opacity = 1));
        target.style.visibility = "visible";
        return;
      }
      letters.forEach((l, i) => anim(l, [{ fontStretch: "50%", opacity: 0, transform: "translateY(10px)" }, { fontStretch: "112%", opacity: 1, transform: "none" }], { dur: DUR.smooth, delay: i * 35, ease: SPR.smooth }));
      await sleep(380);
      tittle.classList.remove("off");
      anim(tittle, [{ opacity: .15 }, { opacity: 1, offset: .15 }, { opacity: .25, offset: .3 }, { opacity: 1, offset: .45 }, { opacity: .6, offset: .6 }, { opacity: 1 }], { dur: 450, ease: "steps(1, end)" });
      anim($(".boot-cap"), [{ opacity: 0 }, { opacity: 1 }], { dur: 300, delay: 300 });
      await sleep(820);
      const a = rect(wm), b = rect(target);
      anim($(".boot-cap"), [{ opacity: 1 }, { opacity: 0 }], { dur: 150 });
      anim(wm, [{ transform: "none" }, { transform: `translate(${b.x - a.x}px, ${b.y - a.y}px) scale(${b.w / a.w})` }], { dur: DUR.gentle, ease: SPR.gentle });
      anim(boot, [{ backgroundColor: "#0B0C12" }, { backgroundColor: "rgba(11,12,18,0)" }], { dur: 500, delay: 120, ease: EASE_IO });
      $$(".h-greet, .h-sec, .h-live, .h-rows", house).forEach((e, i) => anim(e, [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { dur: 420, delay: 380 + i * 40 }));
      await sleep(DUR.gentle);
      target.style.visibility = "visible";
      boot.remove();
    },
  });

  // ---- Tuning in -----------------------------------------------------------------------
  scene({
    id: "tune", group: "Arriving", name: "Tuning in",
    lede: "Opening a pod is tuning a radio. The needle hunts while the pod loads, locks onto the station when it arrives, the static clears, and the stage floods in from the dial.",
    when: "Opening any pod at <code>/show/:id</code>, until its audio can play. Replaces the \"Tuning in&hellip;\" spinner.",
    driven: "Needle hunts while <code>api.getShow()</code> is pending and locks when it returns. Static clears as the WebSocket snapshot lands (<code>ctl._snapshotSeen</code>). The flood starts when <code>tuneInWhenReady()</code> fires.",
    timing: ["needle: spring k 90, c 9", "static fade 1.6 s", "flood: clip-path, spring gentle 850 ms"],
    reduced: "A still dial with the station name, then the stage fades in.",
    mount() {
      screen.innerHTML = `<div class="tune"><canvas width="90" height="190"></canvas><div class="tune-mid"><p class="tune-label">Tuning in</p><div class="dial"><svg viewBox="0 0 300 64" preserveAspectRatio="none"></svg><span class="needle"></span></div><span class="freq">88.0</span><div class="station"><b>${TITLE}</b><span>Live with Mia and Jordan</span></div></div><div class="flood">${stageHtml()}</div></div>`;
      primeStage(screen);
      const svg = $(".dial svg");
      let out = "";
      for (let f = 880; f <= 1080; f += 2) {
        const x = ((f - 880) / 200) * 300, maj = f % 20 === 0;
        out += `<line data-f="${f}" class="${maj ? "maj" : ""}" x1="${x}" x2="${x}" y1="${maj ? 14 : 24}" y2="48"/>`;
        if (maj) out += `<text x="${x}" y="62" text-anchor="middle">${f / 10}</text>`;
      }
      svg.innerHTML = out;
      this.needle = { x: 88, v: 0, target: 88 };
      this.noise = 0.55;
      this.ctx = $(".tune canvas").getContext("2d");
      this.img = this.ctx.createImageData(90, 190);
    },
    tick(dt) {
      const n = this.needle; if (!n) return;
      if (!calm) { n.v += (90 * (n.target - n.x) - 9 * n.v) * dt; n.x += n.v * dt; } else n.x = n.target;
      const nd = $(".needle"); if (!nd) return;
      nd.style.left = `${((n.x - 88) / 20) * 100}%`;
      $(".freq").textContent = n.x.toFixed(1);
      if (this.noise > 0.01 && !calm) {
        const d = this.img.data;
        for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
        this.ctx.putImageData(this.img, 0, 0);
      }
      $(".tune canvas").style.opacity = calm ? 0 : this.noise;
    },
    async play() {
      const station = $(".station"), flood = $(".flood");
      if (calm) {
        this.needle.target = 98.6; this.noise = 0; station.style.opacity = 1;
        await sleep(900);
        flood.style.clipPath = "none";
        anim(flood, [{ opacity: 0 }, { opacity: 1 }], { dur: 250 });
        this.caps = new Caps($(".stage", flood));
        return;
      }
      const fade = (to, ms) => { const from = this.noise, t0 = performance.now(); const f = () => { const p = Math.min(1, (performance.now() - t0) / (ms / speed)); this.noise = from + (to - from) * p; if (p < 1) requestAnimationFrame(f); }; f(); };
      this.needle.target = 102.2; fade(0.4, 700); await sleep(700);
      this.needle.target = 95.4; fade(0.25, 650); await sleep(650);
      this.needle.target = 98.6; fade(0.0, 1000); await sleep(1100);
      $$(".dial line").forEach((l) => Math.abs(+l.dataset.f - 986) <= 6 && l.classList.add("hot"));
      anim(station, [{ opacity: 0, transform: "translateY(8px)", fontStretch: "70%" }, { opacity: 1, transform: "none", fontStretch: "100%" }], { dur: DUR.smooth, ease: SPR.smooth });
      await sleep(900);

  function makeDraggable(el, { onClose, onMove }) {

    });
    el.addEventListener("pointermove", (e) => {
      if (!active) return;
      const now = performance.now();
      v = (e.clientY - last) / Math.max(1, now - lastT); last = e.clientY; lastT = now;

      el.style.transform = `translateY(${y}px)`;
      onMove?.(Math.max(0, dy) / el.offsetHeight);
    });
    const end = () => {

      if (calm) { card.style.opacity = 0; } else {
        const a = rect(nm), b = rect(target);
        anim(nm, [{ transform: "none" }, { transform: `translate(${b.x - a.x}px, ${b.y - a.y}px) scale(${(b.h / a.h) * 1.4})`, opacity: 0.2 }], { dur: DUR.gentle, ease: SPR.gentle, fill: "forwards" });
        $$(".pre, .ep, .wv", card).forEach((e) => anim(e, [{ opacity: 1 }, { opacity: 0 }], { dur: 250, fill: "forwards" }));
      }
      await sleep(calm ? 0 : 500);
      $$(".s-caps, .s-ep b, .s-chap", st).forEach((e, i) => { e.style.opacity = 1; if (!calm) anim(e, [{ opacity: 0 }, { opacity: 1 }], { dur: 400, delay: i * 60 }); });
      this.sting = false;
      this.caps = new Caps(st, [{ who: 0, text: "Welcome to Walk and Talk, the show where big ideas start on a walk. I'm Mia." }, { who: 1, text: "And I'm Jordan. Today: wild yeast, the Gold Rush, and a very old jar." }]);
      await sleep(500);
      card.style.opacity = 0;
    },
    frame(dt) { this.caps?.tick(dt); },
  });

  // ---- Checking your watchlist (briefings) -------------------------------------------------------
  const WATCHES = [["Ferment Lab", "fermentlab.blog, new posts", 3], ["Acme Ovens pricing", "acmeovens.example/pricing", 1], ['"climate tech funding"', "News search, with Google", 2], ["City council agenda", "cityhall.example/agenda", 0], ["Trail conditions", "trails.example/status", 0]];
  scene({
    id: "watch", group: "Briefings", name: "Checking your watchlist", isNew: true,
    lede: "Making a briefing starts by checking what you watch. Each site lights up as it's checked: amber with a count when something's new, grey when it's quiet. Then the house lights go down on your private briefing.",
    when: "Pressing Make my briefing, or opening one that's being made on schedule.",
    driven: "The make call checks the watchlist before writing (today the button only says \"Checking your watchlist&hellip;\"). Per-row ticks need the make call to report each watch as it's checked, or the page to poll <code>api.watches()</code>; until then, rows tick together when the call returns. The briefing then opens on a library theme matched to its template's mood (<code>music_mood</code>: Morning roundup is upbeat), before the hosts' good morning.",
    timing: ["button holds a mini ring", "each row: sweep 500 ms, lamp + count pop (spring bouncy)", "rows 350 ms apart", "house lights down from the button: spring gentle"],
    reduced: "Rows update in place with no sweep; the briefing fades in.",
    mount() {
      screen.innerHTML = `<div class="house"><header class="h-top"><span style="display:inline-flex;align-items:center;gap:6px;font-weight:700">${ICON.back}You</span></header>
        <h3 class="h-greet" style="padding-top:2px">Briefings</h3>
        <div class="bk"><b class="t">Make one now</b><span class="bk-sum" data-sum>5 sites, pages and searches to check.</span><button class="bk-go" type="button" data-make>${ICON.play.replace('width="26" height="26"', 'width="16" height="16"')}Make my briefing, 2 credits</button></div>
        <div class="wrows">${WATCHES.map(([n, k]) => `<div class="wrow"><span class="lampx"></span><span style="min-width:0"><b>${n}</b><small>${k}</small></span><span class="cnt-badge"></span><span class="sweep"></span></div>`).join("")}</div></div>
        <div class="hl-stage" style="position:absolute;inset:0;z-index:20;visibility:hidden">${stageHtml({ gel: "#6FB3FF", chapter: "Watchlist roundup, 1 of 4" })}</div>`;
      primeStage(screen);
      const st = $(".hl-stage .stage");
      $(".s-ep b", st).textContent = "Morning roundup";
      $(".s-listen", st).textContent = "Only you";
    },
    async play() {
      const go = $("[data-make]"), sum = $("[data-sum]"), rows = $$(".wrow");
      await sleep(800);
      anim(go, [{ transform: "scale(1)" }, { transform: "scale(.97)" }, { transform: "scale(1)" }], { dur: 220 });
      go.innerHTML = `<span class="mini"></span>Checking your watchlist`;
      let total = 0, sites = 0;
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i], n = WATCHES[i][2];
        if (!calm) anim($(".sweep", r), [{ transform: "translateX(-100%)" }, { transform: "translateX(100%)" }], { dur: 500, ease: EASE_IO });
        await sleep(calm ? 120 : 350);
        const lamp = $(".lampx", r), badge = $(".cnt-badge", r);
        if (n) {
          lamp.className = "lampx amber"; badge.textContent = n; badge.style.opacity = 1;
          if (!calm) anim(badge, [{ transform: "scale(.4)" }, { transform: "none" }], { dur: DUR.bouncy, ease: SPR.bouncy });
          total += n; sites += 1;
        } else { $("small", r).textContent = "Nothing new"; }
        sum.textContent = `${total} update${total === 1 ? "" : "s"} from ${sites} so far.`;
      }
      sum.textContent = `${total} updates from ${sites} sources. Writing your briefing.`;
      go.innerHTML = "Going live";
      await sleep(700);
      // house lights down, from the button
      const stw = $(".hl-stage"), b = rect(go), cx = b.x + b.w / 2, cy = b.y + b.h / 2, R = Math.hypot(screen.clientWidth, screen.clientHeight);
      stw.style.visibility = "visible";
      if (calm) anim(stw, [{ opacity: 0 }, { opacity: 1 }], { dur: 250 });
      else anim(stw, [{ clipPath: `circle(0px at ${cx}px ${cy}px)` }, { clipPath: `circle(${R}px at ${cx}px ${cy}px)` }], { dur: DUR.gentle, ease: SPR.gentle });
      // a briefing opens on a library theme matched to its template's mood, then the hosts say good morning
      const lst = $(".s-listen", stw);
      lst.textContent = "Theme music";
      await sleep(1500);
      lst.textContent = "Only you";
      this.caps = new Caps($(".stage", stw), [{ who: 1, text: "Morning, Marc. Six things changed overnight, starting with your oven people." }, { who: 0, text: "Acme Ovens raised the price of their pro model by ninety dollars. The old price is still on their sale page." }]);
    },
    frame(dt) { this.caps?.tick(dt); },
  });

  // ---- Recording a memo -----------------------------------------------------------------------------
  scene({
    id: "memo", group: "Voice memo", name: "Recording a memo", isNew: true,
    lede: "The record button sits inside the studio clock. One dot is ten seconds, so the full ring is the 10-minute limit. Your voice moves the level bars; when you're done, the recording folds into a playable memo on the options page.",
    when: "Recording at <code>/memo</code> (uploading a file skips straight to the options).",
    driven: "<code>MemoRecorder</code> in <code>audio/recorder.js</code>: MediaRecorder with a level from an AnalyserNode, the duration from the timer (Chrome reports webm duration as Infinity), a wake lock while recording, and a guard before leaving the page.",
    timing: ["button: circle to rounded square, spring snappy", "ring: one dot per 10 s", "pause: ring dims to 45%, levels rest", "levels: every frame, smoothed", "fold into the memo chip: spring smooth"],
    reduced: "The timer and ring still advance; levels show a steady bar; the options page fades in.",
    mount() {
      screen.innerHTML = `<div class="stage" style="--gel:#FFB257"><header class="s-top"><span style="display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px">${ICON.back}New pod</span><span class="s-listen">Voice memo</span></header>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px"><div><div class="memo-time" data-time>0:00</div><p class="memo-hint" data-hint>Tap to record. Up to 10 minutes.</p></div>
          <div class="rec">${ringSvg()}<span class="rb" data-rec><i></i></span></div><div class="levels">${"<i></i>".repeat(26)}</div></div>
        <div style="padding:0 18px 28px;display:flex;gap:8px;opacity:0" data-ctl><span class="btn" style="flex:1;background:rgba(255,255,255,.12);color:#fff;height:46px;border-radius:999px;display:grid;place-items:center;font-weight:800">Pause</span><span style="flex:1;background:#fff;color:#141720;height:46px;border-radius:999px;display:grid;place-items:center;font-weight:800">Done</span></div></div>
        <div class="memo-opts"><div class="house"><header class="h-top"><span style="display:inline-flex;align-items:center;gap:6px;font-weight:700">${ICON.back}Voice memo</span></header>
          <div class="memo-chip"><span class="pb">${ICON.play.replace('width="26" height="26"', 'width="16" height="16"')}</span><span class="wv">${"<i></i>".repeat(34)}</span><b style="font-size:12px" data-len>2:14</b></div>
          <div class="h-sec">How long?</div><div class="chips" style="padding-top:0"><button class="chip">5 min</button><button class="chip">10 min</button><button class="chip" aria-pressed="true">15 min</button></div>
          <div class="h-sec">Theme music</div><div class="h-rows" style="padding:0 16px;font-size:13px;color:#4F5667">Included: a studio theme that suits it. Free.</div></div></div>`;
      this.dots = drawRing($(".rec svg"), 46, 2.4);
      this.rec = false; this.sec = 0; this.lv = Array(26).fill(0.08);
    },
    tick(dt) {
      if (!this.dots) return;
      if (this.rec) {
        this.sec += dt * 40;      // the demo runs 40x: a second of watching is 40 s of memo
        $("[data-time]").textContent = `${Math.floor(this.sec / 60)}:${String(Math.floor(this.sec % 60)).padStart(2, "0")}`;
        const n = Math.min(60, Math.floor(this.sec / 10));
        this.dots.forEach((d, i) => d.classList.toggle("lit", i < n));
      }
      const bars = $$(".levels i");
      this.lv = this.lv.map((v, i) => { const target = this.rec && !calm ? 0.12 + 0.88 * Math.abs(Math.sin(performance.now() / (90 + i * 7) + i)) * (0.4 + 0.6 * Math.random()) : this.rec ? 0.35 : 0.08; return v + (target - v) * 0.35; });
      bars.forEach((b, i) => (b.style.height = `${Math.round(this.lv[i] * 100)}%`));
    },
    async play() {
      const rb = $("[data-rec]"), dot = $("i", rb);
      await sleep(900);
      anim(rb, [{ transform: "scale(1)" }, { transform: "scale(.92)" }, { transform: "scale(1)" }], { dur: 240 });
      if (!calm) anim(dot, [{ transform: "scale(0)" }, { transform: "scale(1)" }], { dur: DUR.snappy, ease: SPR.snappy, fill: "forwards" }); else dot.style.transform = "scale(1)";
      $("[data-hint]").textContent = "Recording. Each dot is ten seconds.";
      this.rec = true;
      $("[data-ctl]").style.opacity = 1;
      await sleep(1700);
      // pause: the clock holds, the levels rest, the button says Resume
      this.rec = false;
      const pb = $("[data-ctl] span");
      pb.textContent = "Resume"; $("[data-hint]").textContent = "Paused";
      if (!calm) anim($(".rec svg"), [{ opacity: 1 }, { opacity: .45 }], { dur: 200, fill: "forwards" });
      await sleep(1200);
      pb.textContent = "Pause"; $("[data-hint]").textContent = "Recording. Each dot is ten seconds.";
      if (!calm) anim($(".rec svg"), [{ opacity: .45 }, { opacity: 1 }], { dur: 200, fill: "forwards" });
      this.rec = true;
      await sleep(1660);
      this.rec = false;
      const len = $("[data-time]").textContent;
      $("[data-len]").textContent = len;
      $("[data-hint]").textContent = "Saved.";
      await sleep(500);
      // the recording folds into a memo you can play, and the options rise
      const opts = $(".memo-opts"), chip = $(".memo-chip .wv"), levels = $(".levels");
      $$(".memo-chip .wv i").forEach((b, i) => (b.style.height = `${Math.round(20 + 80 * Math.abs(Math.sin(i * 1.7)))}%`));
      if (calm) { opts.style.transform = "none"; return; }
      anim(opts, [{ transform: "translateY(100%)" }, { transform: "none" }], { dur: DUR.smooth, ease: SPR.smooth, fill: "forwards" });
      const a = rect(levels);
      await sleep(80);
      const b = rect(chip);
      const ghost = levels.cloneNode(true);
      ghost.style.cssText = `position:absolute;z-index:40;left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px;transform-origin:0 0`;
      screen.append(ghost);
      $$(".memo-chip .wv i").forEach((b) => (b.style.opacity = 0));
      await anim(ghost, [{ transform: "none", opacity: 1 }, { transform: `translate(${b.x - a.x}px, ${b.y - a.y}px) scale(${b.w / a.w}, ${b.h / a.h})`, opacity: 0.4 }], { dur: DUR.smooth, ease: SPR.smooth, fill: "forwards" }).finished;
      ghost.remove();
      $$(".memo-chip .wv i").forEach((b, i) => anim(b, [{ opacity: 0 }, { opacity: 1 }], { dur: 200, delay: i * 8, fill: "forwards" }));
    },
  });

  // ---- Making a pod from a memo ---------------------------------------------------------------------
  const MEMO_STAGES = [
    ["Listening to your memo", '"&hellip;so bread is basically a pet you can eat."'],
    ["Looking things up", "9 facts, 2 to double-check"],
    ["Planning the episode", "6 chapters, 15 minutes"],
    ["Waiting for a free studio", "You're next"],
    ["Recording the hosts", "Chapter 6 of 6"],
    ["Adding the music", "Morning walk, from your show intro"],
    ["Mixing", "Theme under the welcome, stings between chapters"],
    ["Saving the episode", ""],
  ];
  scene({
    id: "memomake", group: "Voice memo", name: "Making a pod from a memo", isNew: true,
    lede: "Production runs on a spine of lamps. Each stage shows what it made as it finishes: a line it heard in your memo, what research found, the title and chapters. The ring fills in eight arcs. You can leave; when it's done the spine folds into the pod's sleeve.",
    when: "After Make my pod (or Produce, if you reviewed the outline), until the pod is ready.",
    driven: "<code>views/memo-status.js</code> polls <code>getShow</code> every 3 s: <code>show.render.stage</code> picks the lamp (transcribing, researching, outlining, queued, voicing, scoring, mixing, saving; the queued lamp only appears when there's a wait), <code>render.progress</code> fills the ring and <code>render.detail</code> is the line under the lamp. With Review the outline first on, it stops after planning and shows the review screen. In the library, the same progress shows on the pod's sleeve.",
    timing: ["lamp: amber blink while working", "rail fills 400 ms ease-in-out", "detail line types in", "ring: one arc per stage", "fold into the sleeve: spring gentle"],
    reduced: "Lamps and lines change in place; the sleeve appears at the end.",
    mount() {
      screen.innerHTML = `<div class="ed" style="--gel:#6FB3FF;--gel-text:#9CC2FF"><p style="margin:54px 18px 0;font-size:12.5px;font-weight:700;color:#8C92A3">Making your pod</p>
        <h3 class="mm-title" style="margin:5px 18px 0;font:800 26px/1 var(--f-display);font-stretch:84%;min-height:26px">Voice memo, 2:14</h3>
        <div style="margin:14px auto 10px;width:100px;height:100px;position:relative">${ringSvg("ring mm-ring")}<b class="mm-pc" style="position:absolute;inset:0;display:grid;place-items:center;font:800 22px var(--f-display);font-stretch:86%;font-variant-numeric:tabular-nums">0%</b></div>
        <ol class="spine">${MEMO_STAGES.map(([s]) => `<li><span class="lampx"></span><span>${s}<small></small></span><span class="rail"><b></b></span></li>`).join("")}</ol>
        <p style="margin:auto 18px 22px;font-size:12.5px;color:#8C92A3;text-align:center">You can leave this page. It'll be in Your pods when it's ready.</p>
        <div class="ed-done"><span class="sleeve">${ringSvg("rg ring")}<span class="t">Bread, Banter and Bad Puns</span><span class="h">Walk &amp; Talk</span></span><h4>Your pod is ready</h4><p>15 minutes, 6 chapters. Made from your 2:14 memo.</p><span class="listen">Listen to it</span></div></div>`;
      this.dots = drawRing($(".mm-ring"), 44, 2.6);
      $$(".ed-done .rg").forEach((svg) => drawRing(svg, 44, 2).forEach((d, i) => i % 3 === 0 && d.classList.add("lit")));
    },
    async play() {
      const lis = $$(".spine li"), pc = $(".mm-pc"), title = $(".mm-title");
      const light = (k) => this.dots.forEach((d, i) => d.classList.toggle("lit", Math.floor(i / 7.5) < k && i % 15 !== 14 && i % 15 !== 7));
      await sleep(600);
      for (let k = 0; k < lis.length; k++) {
        const li = lis[k], lamp = $(".lampx", li), small = $("small", li);
        li.className = "now"; lamp.className = calm ? "lampx amber" : "lampx amber blink";
        if (k === 4) for (let c = 1; c <= 6; c++) { small.textContent = `Chapter ${c} of 6`; await sleep(260); }
        else await sleep(k === 3 ? 500 : 900);
        li.className = "done"; lamp.className = "lampx blue";
        if (k !== 4 && MEMO_STAGES[k][1]) { small.innerHTML = ""; await typeInto(small, MEMO_STAGES[k][1].replace("&hellip;", String.fromCharCode(8230)), 14); }
        if (k === 2) await typeInto(title, "Bread, Banter and Bad Puns", 24);
        if (!calm) anim($(".rail b", li), [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], { dur: 400, ease: EASE_IO, fill: "forwards" }); else $(".rail b", li).style.transform = "scaleY(1)";
        light(k + 1);
        pc.textContent = `${Math.round(((k + 1) / lis.length) * 100)}%`;
      }
      await sleep(600);
      const done = $(".ed-done"), sleeve = $(".sleeve", done);
      $$(".ed > :not(.ed-done)").forEach((e) => (calm ? (e.style.opacity = 0) : anim(e, [{ opacity: 1 }, { opacity: 0 }], { dur: 260, fill: "forwards" })));
      done.style.opacity = 1;
      if (!calm) {
        anim(sleeve, [{ opacity: 0, transform: "scale(.6) rotate(-6deg)" }, { opacity: 1, transform: "none" }], { dur: DUR.bouncy, delay: 200, ease: SPR.bouncy });
        $$("h4, p, .listen", done).forEach((e, i) => anim(e, [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { dur: 420, delay: 460 + i * 60 }));
      }
    },
  });

  // =================================================================================
  // Bench wiring
  // =================================================================================
  const nav = $("#scenes");
  const groups = [...new Set(SCENES.map((s) => s.group))];
  nav.innerHTML = groups.map((g) => `<div class="grp"><h2>${g}</h2><ul>${SCENES.filter((s) => s.group === g).map((s) => `<li><button class="scene-btn" type="button" data-scene="${s.id}"><span class="lamp"></span>${s.name}${s.isNew ? '<span class="new-dot">NEW</span>' : ""}</button></li>`).join("")}</ul></div>`).join("");

  function renderSpec(s) {
    $("#spec").innerHTML = `<h2>${s.name}</h2><p class="lede">${s.lede}</p>
      <dl><div><dt>When it plays</dt><dd>${s.when}</dd></div><div><dt>Driven by</dt><dd>${s.driven}</dd></div>
      <div><dt>Timing</dt><dd><span class="tokens">${s.timing.map((t) => `<span class="tok">${t}</span>`).join("")}</span></dd></div>
      <div><dt>With reduced motion</dt><dd>${s.reduced}</dd></div></dl>`;
    $("#bench-row").innerHTML = s.options || "";
    $("#hint").textContent = s.interactive || "";
  }

  async function start(id) {
    const s = SCENES.find((x) => x.id === id) || SCENES[0];
    run++;
    userTook = false;
    const myRun = run;
    if (current !== s) { current = s; renderSpec(s); }
    $$(".scene-btn").forEach((b) => b.setAttribute("aria-current", String(b.dataset.scene === s.id)));
    for (const k of ["caps", "needle", "dots", "ring", "chasing", "mic", "isOpen", "listening", "rec", "sting", "side", "bubOn"]) delete s[k];
    s.mount();
    screen.insertAdjacentHTML("beforeend", `<span class="island"></span>${calm ? '<span class="calm-note">Reduced motion</span>' : ""}`);
    // A scene that was switched away from may still be mid-await; its errors are stale.
    try { await s.play(); } catch (e) { if (e !== ABORT && myRun === run) console.error(e); return; }
    if (myRun !== run) return;
    try { await sleep(2600); } catch { return; }
    if (loop && !userTook && myRun === run) start(s.id);
  }

  nav.addEventListener("click", (e) => { const b = e.target.closest("[data-scene]"); if (b) { try { history.replaceState(null, "", "#" + b.dataset.scene); } catch {} start(b.dataset.scene); } });
  $("#replay").addEventListener("click", () => start(current.id));
  $$("[data-speed]").forEach((b) => b.addEventListener("click", () => { speed = +b.dataset.speed; $$("[data-speed]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }));
  $("#loop").addEventListener("click", (e) => { loop = !loop; e.currentTarget.setAttribute("aria-pressed", String(loop)); if (loop) start(current.id); });
  const setCalm = (v) => { calm = v; $("#calm").setAttribute("aria-pressed", String(v)); };
  setCalm(calm);
  $("#calm").addEventListener("click", () => { setCalm(!calm); start(current.id); });
  mq.addEventListener("change", () => { setCalm(mq.matches); start(current.id); });
  $("#bench-row").addEventListener("change", () => start(current.id));

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * speed;
    last = now;
    if (current) { current.tick?.(dt); current.frame?.(dt); }
    for (const a of document.getAnimations()) if (a.playbackRate !== speed) a.playbackRate = speed;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const fromHash = (location.hash || "").slice(1);
  start(SCENES.some((s) => s.id === fromHash) ? fromHash : "greenroom");
})();
</script>
